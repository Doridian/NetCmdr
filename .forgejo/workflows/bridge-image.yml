# The bridge's container image comes out of the flake, not out of a Dockerfile:
# `.#netcmdr-bridge-image-<arch>` is the static binary and nothing else, so
# there is nothing here for buildx to do. That is why this does not use the
# shared docker.yml template, and why it is not named docker.yml — a central
# deploy of that template would land on top of it.
#
# Both architectures are built on this one runner, the arm64 one by
# cross-compiling. That is nearly free: the bridge is Go with CGO off, so the
# other architecture is a GOARCH away with no second toolchain and no libc to
# match, and the wasm client it embeds is the same derivation whatever the
# bridge is built for, so that half is compiled once instead of once per
# architecture.
name: Bridge image

concurrency:
  group: bridge-image-${{ github.ref }}
  cancel-in-progress: true

enable-openid-connect: true

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

jobs:
  bridge-image:
    runs-on: ${{ vars.MANAGED_RUNNER_TAG || 'ubuntu-26.04' }}
    steps:
      - id: jwt
        run: get-actions-jwt
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && github.ref == 'refs/heads/main' }}
      - id: repository_case
        uses: https://github.com/ASzc/change-string-case-action@v8
        with:
          string: ${{ github.repository }}
      - name: Check out the repo
        uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.EXT_GITHUB_TOKEN }}
          enable_kvm: false
          install_options: --no-daemon
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=
            trusted-substituters = http://host.docker.internal:1111?trusted=true https://cache.nixos-cuda.org https://cache.nixos.org/
            substituters = http://host.docker.internal:1111?trusted=true https://cache.nixos-cuda.org https://cache.nixos.org/
      - run: nix registry add nixpkgs github:NixOS/nixpkgs/nixos-26.05
      - run: start-docker
      # This also builds both bridges and the wasm client they share, and runs
      # the bridge's Go tests on the way through. The tests run once, under the
      # amd64 build: nothing here can execute an aarch64 test binary, so the
      # flake does not try.
      - name: Build the images
        run: |
          nix build '.#netcmdr-bridge-image-amd64' -o result-amd64
          nix build '.#netcmdr-bridge-image-arm64' -o result-arm64
      # What the tarballs call themselves, asked of the flake rather than
      # scraped out of `docker load`'s output.
      - id: image
        name: Load the images
        run: |
          docker load < result-amd64
          docker load < result-arm64
          echo "name=$(nix eval --raw '.#netcmdr-bridge-image-amd64.imageName')" >> "$GITHUB_OUTPUT"
          echo "amd64=$(nix eval --raw '.#netcmdr-bridge-image-amd64.imageTag')" >> "$GITHUB_OUTPUT"
          echo "arm64=$(nix eval --raw '.#netcmdr-bridge-image-arm64.imageTag')" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Registry
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: git.foxden.network
          username: forgejo
          password: ${{ steps.jwt.outputs.jwt }}
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && github.ref == 'refs/heads/main' }}
      # One moving tag and nothing else, as before, except that it now names an
      # index over both architectures. The two images are pushed under that tag
      # first and the index replaces it: an index can only name manifests the
      # registry already holds, and this tag is the only name published, so for
      # the length of the push it points at one architecture at a time.
      #
      # The index is put there by regctl, after `docker manifest` and `docker
      # buildx imagetools` both reached the registry unauthenticated — `denied`
      # and `unauthorized` from the first, `insufficient_scope` from the second
      # — while the `docker push` two lines above them, in the same shell with
      # the same config, authenticated fine. That is the asymmetry to know
      # about: a push is the daemon's work and the CLI hands it the
      # credentials, whereas an index is the client's own, and neither client
      # picked up what docker/login-action left behind. This registry answers
      # an unauthenticated caller with a token whose scope is empty rather than
      # with a refusal, which is where `insufficient_scope` comes from. regctl
      # is handed the credential outright, so there is nothing for it to
      # discover, and `index create --digest` names manifests already in the
      # repository instead of copying anything into it.
      - name: Push the image
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && github.ref == 'refs/heads/main' }}
        env:
          REGISTRY_TOKEN: ${{ steps.jwt.outputs.jwt }}
        run: |
          dockertag='git.foxden.network/${{ steps.repository_case.outputs.lowercase }}:${{ vars.OCI_TAG || 'latest' }}'
          amd64='${{ steps.image.outputs.name }}:${{ steps.image.outputs.amd64 }}'
          arm64='${{ steps.image.outputs.name }}:${{ steps.image.outputs.arm64 }}'
          # Each image by the digest the registry gave it, read back off the
          # image as soon as it is pushed rather than scraped out of what
          # `docker push` printed. The digest alone is enough: the index lands
          # in the repository they were just pushed to.
          digests=()
          for image in "$amd64" "$arm64"; do
            docker tag "$image" "$dockertag"
            docker push "$dockertag"
            repodigest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
            digests+=(--digest "${repodigest##*@}")
          done
          regctl="$(nix build --no-link --print-out-paths 'nixpkgs#regclient')/bin/regctl"
          printf '%s' "$REGISTRY_TOKEN" |
            "$regctl" registry login git.foxden.network --user forgejo --pass-stdin
          "$regctl" index create "$dockertag" "${digests[@]}"
