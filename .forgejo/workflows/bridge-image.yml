# The bridge's container image comes out of the flake, not out of a Dockerfile:
# `.#netcmdr-bridge-image-<arch>` is the static binary and nothing else, so
# there is nothing here for buildx to do. That is why this does not use the
# shared docker.yml template, and why it is not named docker.yml — a central
# deploy of that template would land on top of it.
#
# Both architectures are built on this one runner, the arm64 one by
# cross-compiling. That is nearly free: the bridge is Go with CGO off, so the
# other architecture is a GOARCH away with no second toolchain and no libc to
# match, and the wasm client it embeds is the same derivation whatever the
# bridge is built for, so that half is compiled once instead of once per
# architecture.
name: Bridge image

concurrency:
  group: bridge-image-${{ github.ref }}
  cancel-in-progress: true

enable-openid-connect: true

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

jobs:
  bridge-image:
    runs-on: ${{ vars.MANAGED_RUNNER_TAG || 'ubuntu-26.04' }}
    steps:
      - id: jwt
        run: get-actions-jwt
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && github.ref == 'refs/heads/main' }}
      - id: repository_case
        uses: https://github.com/ASzc/change-string-case-action@v8
        with:
          string: ${{ github.repository }}
      - name: Check out the repo
        uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.EXT_GITHUB_TOKEN }}
          enable_kvm: false
          install_options: --no-daemon
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=
            trusted-substituters = http://host.docker.internal:1111?trusted=true https://cache.nixos-cuda.org https://cache.nixos.org/
            substituters = http://host.docker.internal:1111?trusted=true https://cache.nixos-cuda.org https://cache.nixos.org/
      - run: nix registry add nixpkgs github:NixOS/nixpkgs/nixos-26.05
      # This also builds both bridges and the wasm client they share, and runs
      # the bridge's Go tests on the way through. The tests run once, under the
      # amd64 build: nothing here can execute an aarch64 test binary, so the
      # flake does not try.
      - name: Build the images
        run: |
          nix build '.#netcmdr-bridge-image-amd64' -o result-amd64
          nix build '.#netcmdr-bridge-image-arm64' -o result-arm64
      # regctl is the whole registry side of this job: it reads the tarballs
      # the flake produced and it writes the index. Out of the nixpkgs pinned
      # above rather than out of an action, so it is the store path this
      # workflow already trusts and not a binary fetched at run time.
      - id: regctl
        name: Fetch regctl
        run: echo "bin=$(nix build --no-link --print-out-paths 'nixpkgs#regclient')/bin/regctl" >> "$GITHUB_OUTPUT"
      # An OCI layout per architecture, which is what the index is built from
      # below. This is where a pull request stops, and it is the step that
      # would notice a tarball nothing can read.
      - name: Pack the images
        run: |
          regctl='${{ steps.regctl.outputs.bin }}'
          "$regctl" image import ocidir://oci-amd64:img result-amd64
          "$regctl" image import ocidir://oci-arm64:img result-arm64
      # One moving tag and nothing else: the index takes it, and the two
      # manifests under the index are never tagged at all. That is the part
      # three earlier attempts got wrong. They pushed each architecture to the
      # tag in turn and then tried to name both digests, which cannot work on
      # this registry — taking the tag away from a manifest that nothing else
      # refers to deletes it, so by the time the index was written the first
      # architecture was a 404. An untagged manifest that an index refers to is
      # the ordinary shape of a multi-architecture image and keeps fine; it is
      # what every buildx push here produces.
      #
      # `index create --ref` uploads each layout and writes the index over
      # them, so nothing is tagged in between and the tag moves once, at the
      # end, from whatever it pointed at to the finished index.
      #
      # regctl is also given the credential outright rather than left to find
      # one. `docker manifest` and `docker buildx imagetools` both reached the
      # registry unauthenticated — `denied` and `unauthorized` from the first,
      # `insufficient_scope` from the second — although `docker push` in the
      # same shell, with the same config, authenticated fine: a push is the
      # daemon's work and the CLI hands it the credentials, whereas an index is
      # the client's own, and neither client picked up what login-action left
      # behind. (The odd wording of the second is this registry answering an
      # unauthenticated caller with a token whose scope is empty instead of
      # refusing it.) Nothing here needs a docker daemon any more, so the job
      # no longer starts one.
      - name: Push the image
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && github.ref == 'refs/heads/main' }}
        env:
          REGISTRY_TOKEN: ${{ steps.jwt.outputs.jwt }}
        run: |
          regctl='${{ steps.regctl.outputs.bin }}'
          dockertag='git.foxden.network/${{ steps.repository_case.outputs.lowercase }}:${{ vars.OCI_TAG || 'latest' }}'
          printf '%s' "$REGISTRY_TOKEN" |
            "$regctl" registry login git.foxden.network --user forgejo --pass-stdin
          "$regctl" index create "$dockertag" \
            --ref ocidir://oci-amd64:img \
            --ref ocidir://oci-arm64:img
