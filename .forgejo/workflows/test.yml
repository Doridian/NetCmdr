# Lint, then test, Rust and Go, using the flake's dev shell so CI matches
# `nix develop`. One job, so nothing is tested until everything lints.
name: Test

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ vars.MANAGED_RUNNER_TAG || 'ubuntu-26.04' }}
    steps:
      - name: Check out the repo
        uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.EXT_GITHUB_TOKEN }}
          enable_kvm: false
          install_options: --no-daemon
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=
            trusted-substituters = http://host.docker.internal:1111?trusted=true https://cache.nixos-cuda.org https://cache.nixos.org/
            substituters = http://host.docker.internal:1111?trusted=true https://cache.nixos-cuda.org https://cache.nixos.org/
      - name: Build the dev shell
        run: nix develop --command true

      - name: Check the Rust formatting
        run: nix develop --command cargo fmt --all --check
      # netcmdr-web is empty off wasm32; bridge-image.yml builds it.
      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

      # golangci-lint includes govet. See bridge/.golangci.yml.
      - name: Check the bridge's formatting
        run: nix develop --command sh -c 'cd bridge && golangci-lint fmt --diff'
      - name: Lint the bridge
        run: nix develop --command sh -c 'cd bridge && golangci-lint run ./...'

      - name: Test the workspace
        run: nix develop --command cargo test --workspace
      # Without a packed client, as the asset tests expect.
      - name: Test the bridge
        run: nix develop --command sh -c 'cd bridge && go test ./...'
