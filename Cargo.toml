[workspace]
resolver = "2"
members = [
    "crates/netcmdr-proto",
    "crates/netcmdr-mgmt",
    "crates/netcmdr-session",
    "crates/netcmdr-ui",
    "crates/netcmdr-web",
    "crates/netcmdr-cli",
    "crates/netcmdr-view",
    "tools/wasm-bindgen-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://git.foxden.network/FoxDen/NetCmdr"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
quick-xml = "0.42"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Size-optimised profile for the wasm client.
[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
# Panics trap in the browser anyway.
panic = "abort"
strip = true
