[workspace]
resolver = "2"
members = [
    "crates/b070-proto",
    "crates/b070-mgmt",
    "crates/b070-session",
    "crates/b070-cli",
    "crates/b070-view",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/doridian/B070-008-19-IP"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
quick-xml = "0.37"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
