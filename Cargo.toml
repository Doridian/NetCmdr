[workspace]
resolver = "2"
members = [
    "crates/netcmdr-proto",
    "crates/netcmdr-mgmt",
    "crates/netcmdr-session",
    "crates/netcmdr-ui",
    "crates/netcmdr-web",
    "crates/netcmdr-cli",
    "crates/netcmdr-view",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://git.foxden.network/FoxDen/NetCmdr"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
quick-xml = "0.37"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The browser downloads this module before anything happens, so it is built for
# size where the native binaries are built for speed. Kept as its own profile so
# `cargo build --release` is unaffected.
[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
# Unwinding machinery is dead weight in a browser: a panic there is a trap, and
# the hook that reports it still runs.
panic = "abort"
strip = true
