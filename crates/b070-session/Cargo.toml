[package]
name = "b070-session"
description = "KVM session client (video, keyboard, mouse) for Tripp Lite NetCommander / Minicom Smart IP KVM switches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
b070-proto = { path = "../b070-proto" }
flate2 = "1"
quick-xml.workspace = true
thiserror.workspace = true
tracing.workspace = true

# The device's TLS is spoken natively; in a browser `b070-bridge` has already
# terminated it, so nothing here needs a TLS stack.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openssl = "0.10"

# std's Instant compiles for wasm and then panics when called; see src/time.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
