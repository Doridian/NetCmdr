[package]
name = "b070-ui"
description = "Shared viewer UI for Tripp Lite NetCommander / Minicom Smart IP KVM switches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
b070-mgmt = { path = "../b070-mgmt" }
b070-proto = { path = "../b070-proto" }
b070-session = { path = "../b070-session" }
egui = "0.36"
tracing.workspace = true

# Only the native shell needs to translate winit's key codes; the web reads
# `KeyboardEvent.code` strings, which the table already speaks.
winit = { version = "0.30", optional = true }

[features]
winit = ["dep:winit"]
