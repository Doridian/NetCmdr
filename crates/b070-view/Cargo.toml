[package]
name = "b070-view"
description = "KVM viewer for Tripp Lite NetCommander / Minicom Smart IP KVM switches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "b070-view"
path = "src/main.rs"

[dependencies]
b070-mgmt = { path = "../b070-mgmt" }
b070-proto = { path = "../b070-proto" }
b070-session = { path = "../b070-session" }
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit = "0.30"
egui = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
egui_glow = "0.36"
glow = "0.17"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
