[package]
name = "b070-web"
description = "Browser client for Tripp Lite NetCommander / Minicom Smart IP KVM switches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Everything here is browser-only. The crate compiles to nothing on a desktop
# target — see the `cfg` at the top of src/lib.rs — so that `cargo test
# --workspace`, clippy and rustfmt still cover the repository in one pass
# without a desktop build having to resolve a web framework.
[target.'cfg(target_arch = "wasm32")'.dependencies]
b070-mgmt = { path = "../b070-mgmt" }
b070-proto = { path = "../b070-proto" }
b070-session = { path = "../b070-session" }
b070-ui = { path = "../b070-ui" }
egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["glow"] }
js-sys = "0.3"
tracing = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "BinaryType",
    "Blob",
    "CloseEvent",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "KeyboardEvent",
    "MessageEvent",
    "Request",
    "RequestInit",
    "Response",
    "Window",
    "WebSocket",
]
