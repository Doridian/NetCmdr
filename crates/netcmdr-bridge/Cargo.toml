[package]
name = "netcmdr-bridge"
description = "WebSocket and HTTPS bridge that lets a browser talk to a Tripp Lite NetCommander / Minicom Smart IP KVM switch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "netcmdr-bridge"
path = "src/main.rs"

[dependencies]
netcmdr-mgmt = { path = "../netcmdr-mgmt" }
netcmdr-proto = { path = "../netcmdr-proto" }
netcmdr-session = { path = "../netcmdr-session" }
anyhow.workspace = true
# Only the decoder: the web client is stored brotli-compressed in the binary
# and unpacked at startup, and the compressing is the build script's job. The
# encoder's tables are large, so leaving them out of the binary is the point.
brotli-decompressor = "6"
clap.workspace = true
# gzip, for the clients that do not take brotli. Made at startup from the
# brotli copy. Pure Rust, so the bridge still builds with nothing but OpenSSL
# on the system.
flate2 = "1"
# std has no way to install a signal handler, and the bridge needs one to stop
# when it is PID 1 in a container. Already in the tree under openssl-sys.
libc = "0.2"
# OpenSSL is already the device's TLS stack here; the WebSocket accept key is
# a SHA-1 and a base64, so it supplies those too rather than pulling in crates
# that would duplicate them.
openssl = "0.10"
tracing.workspace = true
tracing-subscriber.workspace = true

# Framing only: `handshake` is off because the HTTP upgrade is done by this
# crate's own server, which has already parsed the request by the time a
# WebSocket exists.
[dependencies.tungstenite]
version = "0.30"
default-features = false

# The compressor runs at build time only — see build.rs.
[build-dependencies]
brotli = "9"

# ... and in the tests, so that what they unpack is what the build script
# would really have written.
[dev-dependencies]
brotli = "9"
