[package]
name = "netcmdr-session"
description = "KVM session client (video, keyboard, mouse) for Tripp Lite NetCommander / Minicom Smart IP KVM switches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
netcmdr-proto = { path = "../netcmdr-proto" }
flate2 = "1"
quick-xml.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Native only; the browser goes through `netcmdr-bridge`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openssl = "0.10"

# See src/time.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
