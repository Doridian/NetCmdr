[package]
name = "netcmdr-web"
description = "Browser client for Tripp Lite NetCommander / Minicom Smart IP KVM switches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Browser-only; the crate is empty on desktop targets (see src/lib.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
netcmdr-mgmt = { path = "../netcmdr-mgmt" }
netcmdr-proto = { path = "../netcmdr-proto" }
netcmdr-session = { path = "../netcmdr-session" }
netcmdr-ui = { path = "../netcmdr-ui" }
egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["glow"] }
js-sys = "0.3"
tracing = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "BinaryType",
    "Blob",
    "CloseEvent",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "KeyboardEvent",
    "MessageEvent",
    "Request",
    "RequestInit",
    "Response",
    "Window",
    "WebSocket",
]
