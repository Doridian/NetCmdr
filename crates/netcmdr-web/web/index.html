<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>NetCommander IP KVM</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #101010;
    color: #c8c8c8;
    font: 14px/1.5 system-ui, sans-serif;
  }
  /* The canvas is the whole page: the menu bar is drawn inside it, by egui,
     exactly as it is in the desktop window. */
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
  <div id="loading">Loading…</div>
  <canvas id="netcmdr"></canvas>
  <script type="module">
    import init from "./netcmdr_web.js";
    init()
      .then(() => document.getElementById("loading")?.remove())
      .catch((e) => {
        const box = document.getElementById("loading");
        if (box) box.textContent = "Failed to start: " + e;
        console.error(e);
      });
  </script>
</body>
</html>
